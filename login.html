<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | ZetraTech</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ================= NAVBAR ================= */

    nav {
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 72px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 6%;

      background: rgba(5, 5, 5, 0.94);
      backdrop-filter: blur(15px);

      border-bottom: 1px solid rgba(124, 58, 237, 0.25);

      z-index: 9999;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;

      color: white;
      text-decoration: none;

      font-size: 22px;
      font-weight: bold;
    }

    .logo img {
      width: 38px;
      height: 38px;
      object-fit: contain;
    }

    .logo span {
      color: #a855f7;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 26px;
    }

    .nav-links a {
      color: #ccc;
      text-decoration: none;

      font-size: 14px;

      transition: 0.25s;
    }

    .nav-links a:hover {
      color: #a855f7;
    }

    .login-button {
      padding: 10px 18px;

      border-radius: 8px;

      background: linear-gradient(
        135deg,
        #7c3aed,
        #9333ea
      );

      color: white !important;

      box-shadow:
        0 0 20px rgba(124, 58, 237, 0.3);
    }

    /* ================= LOGIN ================= */

    .login-section {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 120px 20px 60px;

      position: relative;
    }

    .login-section::before {
      content: "";

      position: absolute;

      width: 500px;
      height: 500px;

      background: #7c3aed;

      filter: blur(180px);

      opacity: 0.13;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      pointer-events: none;
    }

    .login-card {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 430px;

      padding: 42px;

      background: rgba(15, 15, 15, 0.96);

      border: 1px solid rgba(168, 85, 247, 0.25);

      border-radius: 18px;

      box-shadow:
        0 0 50px rgba(124, 58, 237, 0.12);
    }

    /* ================= HEADER ================= */

    .login-logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-logo img {
      width: 65px;
      height: 65px;

      object-fit: contain;

      margin-bottom: 12px;
    }

    .login-logo h1 {
      font-size: 29px;
      margin-bottom: 8px;
    }

    .login-logo h1 span {
      color: #a855f7;
    }

    .login-logo p {
      color: #888;
      font-size: 14px;
    }

    /* ================= INPUTS ================= */

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;

      margin-bottom: 8px;

      color: #ddd;

      font-size: 14px;
    }

    .form-group input {
      width: 100%;

      padding: 14px 15px;

      background: #090909;

      border: 1px solid #292929;

      border-radius: 9px;

      color: white;

      font-size: 15px;

      outline: none;

      transition: 0.25s;
    }

    .form-group input::placeholder {
      color: #555;
    }

    .form-group input:focus {
      border-color: #8b5cf6;

      box-shadow:
        0 0 15px rgba(139, 92, 246, 0.18);
    }

    /* ================= OPTIONS ================= */

    .form-options {
      display: flex;

      justify-content: space-between;
      align-items: center;

      margin: 5px 0 24px;

      font-size: 13px;
    }

    .remember {
      display: flex;
      align-items: center;

      gap: 7px;

      color: #999;
    }

    .remember input {
      accent-color: #8b5cf6;
    }

    .forgot {
      color: #a855f7;
      text-decoration: none;
    }

    /* ================= SIGN IN ================= */

    .sign-in {
      width: 100%;

      padding: 14px;

      border: none;
      border-radius: 9px;

      background: linear-gradient(
        135deg,
        #7c3aed,
        #9333ea
      );

      color: white;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;

      transition: 0.25s;

      box-shadow:
        0 0 20px rgba(124, 58, 237, 0.25);
    }

    .sign-in:hover {
      transform: translateY(-2px);

      box-shadow:
        0 0 30px rgba(168, 85, 247, 0.45);
    }

    /* ================= DIVIDER ================= */

    .divider {
      display: flex;

      align-items: center;

      gap: 12px;

      margin: 25px 0;

      color: #555;

      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";

      height: 1px;

      background: #292929;

      flex: 1;
    }

    /* ================= DEMO ================= */

    .demo-btn {
      width: 100%;

      padding: 13px;

      background: transparent;

      border: 1px solid #333;

      border-radius: 9px;

      color: #ccc;

      cursor: pointer;

      transition: 0.25s;
    }

    .demo-btn:hover {
      border-color: #7c3aed;
      color: white;
    }

    /* ================= ACCOUNT ================= */

    .create-account {
      text-align: center;

      margin-top: 25px;

      color: #777;

      font-size: 13px;
    }

    .create-account a {
      color: #a855f7;
      text-decoration: none;
    }

    /* ================= BACK ================= */

    .back-home {
      display: block;

      text-align: center;

      margin-top: 20px;

      color: #666;

      text-decoration: none;

      font-size: 13px;

      transition: 0.25s;
    }

    .back-home:hover {
      color: #a855f7;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 900px) {

      nav {
        padding: 0 20px;
      }

      .nav-links {
        gap: 12px;
      }

      .nav-links a:not(.login-button) {
        display: none;
      }

    }

    @media (max-width: 450px) {

      .logo {
        font-size: 18px;
      }

      .logo img {
        width: 32px;
        height: 32px;
      }

      .login-button {
        padding: 8px 14px;
      }

      .login-card {
        padding: 30px 22px;
      }

    }
  </style>
</head>

<body>

  <!-- ================= NAVBAR ================= -->

  <nav>

    <a
      href="index.html#home"
      class="logo"
    >

      <img
        src="zetratech-logo.png"
        alt="ZetraTech Logo"
      >

      Zetra<span>Tech</span>

    </a>


    <div class="nav-links">

      <a href="index.html#home">
        Home
      </a>

      <a href="index.html#services">
        Services
      </a>

      <a href="index.html#products">
        Products
      </a>

      <a href="index.html#security">
        Security
      </a>

      <a href="index.html#about">
        About
      </a>

      <a href="index.html#contact">
        Contact
      </a>

      <a
        href="login.html"
        class="login-button"
      >
        Login
      </a>

    </div>

  </nav>


  <!-- ================= LOGIN CARD ================= -->

  <section class="login-section">

    <div class="login-card">

      <div class="login-logo">

        <img
          src="zetratech-logo.png"
          alt="ZetraTech Logo"
        >

        <h1>
          Welcome to
          <span>ZetraTech</span>
        </h1>

        <p>
          Sign in to access your account
        </p>

      </div>


      <form>

        <div class="form-group">

          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
          >

        </div>


        <div class="form-options">

          <label class="remember">

            <input type="checkbox">

            Remember me

          </label>

          <a
            href="#"
            class="forgot"
          >
            Forgot password?
          </a>

        </div>


        <button
          type="button"
          class="sign-in"
        >
          Sign In
        </button>

      </form>


      <div class="divider">
        OR
      </div>


      <button
        type="button"
        class="demo-btn"
      >
        Continue with Demo Account
      </button>


      <div class="create-account">

        Don't have an account?

        <a href="#">
          Create account
        </a>

      </div>


      <a
        href="index.html#home"
        class="back-home"
      >
        ← Back to ZetraTech
      </a>

    </div>

  </section>

</body>
</html>
