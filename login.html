<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZetraTech — Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050505;
            color: white;
            min-height: 100vh;
        }

        /* NAVBAR */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;
            background: rgba(5, 5, 5, 0.95);
            border-bottom: 1px solid #222;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        .logo img {
            width: 38px;
            height: 38px;
            object-fit: contain;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #a855f7;
        }

        /* LOGIN AREA */
        .login-container {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 110px 20px 40px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;

            background: #0d0d0d;
            border: 1px solid #252525;
            border-radius: 18px;

            padding: 40px;

            box-shadow:
                0 0 40px rgba(124, 58, 237, 0.12);
        }

        .login-card h1 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .login-card .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ccc;
        }

        .input-group input {
            width: 100%;

            padding: 14px 15px;

            background: #080808;
            border: 1px solid #292929;
            border-radius: 10px;

            color: white;
            outline: none;

            font-size: 14px;

            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #8b5cf6;

            box-shadow:
                0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 25px;

            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #999;
        }

        .remember input {
            accent-color: #8b5cf6;
        }

        .forgot {
            color: #a855f7;
            text-decoration: none;
        }

        .forgot:hover {
            color: #c084fc;
        }

        /* BUTTON */
        .login-btn {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #7c3aed,
                #a855f7
            );

            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 25px rgba(124, 58, 237, 0.3);
        }

        /* DEMO BUTTON */
        .demo-btn {
            width: 100%;

            padding: 13px;
            margin-top: 12px;

            border-radius: 10px;

            border: 1px solid #333;

            background: transparent;
            color: #ccc;

            cursor: pointer;

            font-size: 14px;

            transition: 0.3s;
        }

        .demo-btn:hover {
            border-color: #8b5cf6;
            color: white;
        }

        .create-account {
            text-align: center;

            margin-top: 25px;

            color: #777;

            font-size: 13px;
        }

        .create-account a {
            color: #a855f7;
            text-decoration: none;
        }

        .back-home {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #777;

            font-size: 13px;
            text-decoration: none;
        }

        .back-home:hover {
            color: white;
        }

        /* MOBILE */
        @media (max-width: 800px) {

            .nav-links {
                display: none;
            }

            .login-card {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <nav>

        <a href="index.html#home" class="logo">
            <img src="zetratech-logo.png" alt="ZetraTech Logo">
            ZetraTech
        </a>

        <div class="nav-links">

            <a href="index.html#home">Home</a>
            <a href="index.html#services">Services</a>
            <a href="index.html#products">Products</a>
            <a href="index.html#security">Security</a>
            <a href="index.html#about">About</a>
            <a href="index.html#contact">Contact</a>
            <a href="login.html">Login</a>

        </div>

    </nav>


    <!-- LOGIN -->

    <div class="login-container">

        <div class="login-card">

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Sign in to your ZetraTech account
            </p>


            <form onsubmit="loginUser(event)">

                <div class="input-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="login-options">

                    <label class="remember">

                        <input type="checkbox">

                        Remember me

                    </label>


                    <a href="#" class="forgot">
                        Forgot password?
                    </a>

                </div>


                <button type="submit" class="login-btn">
                    Sign In
                </button>

            </form>


            <button
                class="demo-btn"
                onclick="demoLogin()"
            >
                Continue with Demo Account
            </button>


            <div class="create-account">

                Don't have an account?

                <a href="#">
                    Create account
                </a>

            </div>


            <a
                href="index.html"
                class="back-home"
            >
                ← Back to ZetraTech
            </a>

        </div>

    </div>


    <!-- LOGIN SCRIPT -->

    <script>

        function loginUser(event) {

            event.preventDefault();

            window.location.href = "dashboard.html";

        }


        function demoLogin() {

            window.location.href = "dashboard.html";

        }

    </script>

</body>
</html>
