<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | ZetraTech</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ================= NAVBAR ================= */

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 72px;
      background: rgba(5, 5, 5, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(124, 58, 237, 0.25);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      z-index: 1000;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: white;
      font-size: 22px;
      font-weight: bold;
    }

    .logo img {
      width: 38px;
      height: 38px;
      object-fit: contain;
    }

    .logo span {
      color: #a855f7;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-links a {
      color: #cfcfcf;
      text-decoration: none;
      font-size: 14px;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: #a855f7;
    }

    .nav-links .login-nav {
      background: linear-gradient(135deg, #7c3aed, #9333ea);
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      box-shadow: 0 0 18px rgba(124, 58, 237, 0.35);
    }

    .nav-links .login-nav:hover {
      color: white;
      transform: translateY(-1px);
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.5);
    }

    /* ================= LOGIN AREA ================= */

    .login-section {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 120px 20px 60px;
      position: relative;
    }

    .login-section::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      background: #7c3aed;
      filter: blur(180px);
      opacity: 0.12;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .login-card {
      position: relative;
      width: 100%;
      max-width: 430px;
      padding: 42px;
      background: rgba(15, 15, 15, 0.92);
      border: 1px solid rgba(168, 85, 247, 0.25);
      border-radius: 18px;
      box-shadow:
        0 0 40px rgba(124, 58, 237, 0.12),
        inset 0 0 30px rgba(124, 58, 237, 0.03);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-logo img {
      width: 65px;
      height: 65px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    .login-logo h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .login-logo h1 span {
      color: #a855f7;
    }

    .login-logo p {
      color: #888;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #ddd;
    }

    .form-group input {
      width: 100%;
      padding: 14px 15px;
      background: #090909;
      border: 1px solid #292929;
      border-radius: 9px;
      color: white;
      font-size: 15px;
      outline: none;
      transition: 0.3s;
    }

    .form-group input:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.18);
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 5px 0 24px;
      font-size: 13px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #999;
    }

    .remember input {
      accent-color: #8b5cf6;
    }

    .forgot {
      color: #a855f7;
      text-decoration: none;
    }

    .forgot:hover {
      color: #c084fc;
    }

    .sign-in {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: linear-gradient(135deg, #7c3aed, #9333ea);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 20px rgba(124, 58, 237, 0.25);
    }

    .sign-in:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.4);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 25px 0;
      color: #555;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #292929;
      flex: 1;
    }

    .demo-btn {
      width: 100%;
      padding: 13px;
      background: transparent;
      border: 1px solid #333;
      border-radius: 9px;
      color: #ccc;
      cursor: pointer;
      transition: 0.3s;
    }

    .demo-btn:hover {
      border-color: #7c3aed;
      color: white;
    }

    .create-account {
      text-align: center;
      margin-top: 25px;
      color: #777;
      font-size: 13px;
    }

    .create-account a {
      color: #a855f7;
      text-decoration: none;
    }

    .create-account a:hover {
      color: #c084fc;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #666;
      text-decoration: none;
      font-size: 13px;
      transition: 0.3s;
    }

    .back-home:hover {
      color: #a855f7;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 850px) {
      nav {
        padding: 0 20px;
      }

      .nav-links {
        gap: 12px;
      }

      .nav-links a:not(.login-nav) {
        display: none;
      }

      .login-card {
        padding: 32px 24px;
      }
    }

    @media (max-width: 450px) {
      .logo {
        font-size: 18px;
      }

      .logo img {
        width: 32px;
        height: 32px;
      }

      .login-nav {
        padding: 8px 14px !important;
      }
    }
  </style>
</head>

<body>

  <!-- ================= NAVBAR ================= -->

  <nav>

    <a href="index.html" class="logo">
      <img src="zetratech-logo.png" alt="ZetraTech Logo">
      Zetra<span>Tech</span>
    </a>

    <div class="nav-links">

      <a href="index.html#home">Home</a>

      <a href="index.html#services">Services</a>

      <a href="index.html#products">Products</a>

      <a href="index.html#security">Security</a>

      <a href="index.html#about">About</a>

      <a href="index.html#contact">Contact</a>

      <a href="login.html" class="login-nav">Login</a>

    </div>

  </nav>


  <!-- ================= LOGIN ================= -->

  <section class="login-section">

    <div class="login-card">

      <div class="login-logo">

        <img src="zetratech-logo.png" alt="ZetraTech Logo">

        <h1>Welcome to <span>ZetraTech</span></h1>

        <p>Sign in to access your account</p>

      </div>


      <form>

        <div class="form-group">

          <label for="email">Email Address</label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
          >

        </div>


        <div class="form-group">

          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
          >

        </div>


        <div class="form-options">

          <label class="remember">
            <input type="checkbox">
            Remember me
          </label>

          <a href="#" class="forgot">Forgot password?</a>

        </div>


        <button type="button" class="sign-in">
          Sign In
        </button>

      </form>


      <div class="divider">
        OR
      </div>


      <button class="demo-btn" type="button">
        Continue with Demo Account
      </button>


      <div class="create-account">
        Don't have an account?
        <a href="#">Create account</a>
      </div>


      <a href="index.html" class="back-home">
        ← Back to ZetraTech
      </a>

    </div>

  </section>

</body>
</html>
